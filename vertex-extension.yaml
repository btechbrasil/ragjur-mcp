apiSpec:
  openApiGcsUri: gs://beanstech-configs/ragjur-openapi.json

displayName: RAGJur - Jurimetria Brasileira
description: >
  Busca e análise preditiva em 67M+ decisões judiciais brasileiras de 55 tribunais.
  Ferramentas: busca jurisprudencial, predição de resultado, perfil de juiz,
  divergência entre turmas, evolução jurisprudencial, geração de peças,
  verificação de citações, e análise estratégica.

authConfig:
  authType: API_KEY_AUTH
  apiKeyAuthConfig:
    name: x-api-key
    httpElementLocation: HTTP_IN_HEADER
    apiKeySecret:
      secretManagerRef: projects/beanstech/secrets/RAGJUR_API_KEY/versions/latest

toolUseExamples:
  - extensionOperation:
      operationId: buscar_jurisprudencia
    displayName: Buscar Jurisprudência
    query: "Quais decisões do STJ sobre dano moral em relações de consumo?"
    requestParams:
      query: "dano moral consumidor"
      fonte: "stj_integras"
    responseSummary: "Retorna lista de decisões com ementa, relator, data e número do processo"

  - extensionOperation:
      operationId: predicao_resultado
    displayName: Predição de Resultado
    query: "Qual a chance de sucesso em ação de dano moral contra banco?"
    requestParams:
      busca: "dano moral banco negativação"
      fonte: "stj_integras"
    responseSummary: "Retorna probabilidade de provimento com intervalo de confiança e fatores"

  - extensionOperation:
      operationId: estrategia_juiz
    displayName: Estratégia por Juiz
    query: "Como abordar um caso de consumidor perante o Min. Herman Benjamin?"
    requestParams:
      relator: "MINISTRO HERMAN BENJAMIN"
      tema: "direito do consumidor dano moral"
      fonte: "stj_integras"
    responseSummary: "Retorna perfil detalhado, argumentos eficazes, tendências e recomendações"

  - extensionOperation:
      operationId: divergencia_turmas
    displayName: Divergência entre Turmas
    query: "Há divergência no STJ sobre prescrição em ações de consumo?"
    requestParams:
      busca: "prescrição consumidor"
      fonte: "stj_integras"
    responseSummary: "Retorna comparação de posicionamentos entre turmas/seções"

  - extensionOperation:
      operationId: gerar_peca
    displayName: Gerar Peça Processual
    query: "Gere uma petição inicial contra companhia aérea por atraso de voo"
    requestParams:
      tipo: "peticao_inicial"
      tema: "dano moral atraso voo"
      fonte: "stj_integras"
      fatos: "Passageiro teve voo atrasado 12h, perdeu compromisso profissional"
      lado: "autor"
    responseSummary: "Retorna peça processual completa fundamentada em jurisprudência real"
