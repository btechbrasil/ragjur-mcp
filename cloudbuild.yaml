steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ragjur-mcp:$BUILD_ID', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ragjur-mcp:$BUILD_ID']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ragjur-mcp'
      - '--image=gcr.io/$PROJECT_ID/ragjur-mcp:$BUILD_ID'
      - '--region=southamerica-east1'
      - '--platform=managed'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--timeout=120s'
      - '--concurrency=50'
      - '--allow-unauthenticated'
      - '--set-env-vars=TRANSPORT=streamable-http'
      - '--set-secrets=RAGJUR_API_KEY=RAGJUR_API_KEY:latest'
      - '--update-labels=product=ragjur,layer=tools,env=prod'

images:
  - 'gcr.io/$PROJECT_ID/ragjur-mcp:$BUILD_ID'
